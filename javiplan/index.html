<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved — Cokiletics</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../freecokiletics/styles.css">
</head>
<body>
<main id="app">
  <div class="stack" style="margin-top:var(--space-10);text-align:center">
    <div class="eyebrow">Moved</div>
    <h1>Cokiletics</h1>
    <p class="dim">The app used to live here. Taking you there now…</p>
    <a class="btn btn--primary btn--big btn--block" href="../freecokiletics/">Open Cokiletics</a>
  </div>
</main>
<script>
/* The old address kept its own service worker and offline copy of the app.
   Clear both, or this page could keep serving the old version, and then hand
   over to the new address. */
(async function () {
  try {
    if ("serviceWorker" in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(function (r) { return r.scope.indexOf("/javiplan/") !== -1; })
        .map(function (r) { return r.unregister(); }));
    }
    if (window.caches) {
      var keys = await caches.keys();
      await Promise.all(keys.filter(function (k) { return k.indexOf("javiplan-") === 0; }).map(function (k) { return caches.delete(k); }));
    }
  } catch (e) { /* nothing to clean up */ }
  /* Carry the query AND the hash across. A password-reset link comes back as
     #access_token=…&type=recovery, and Supabase still has this old address in
     its redirect list — forwarding without the hash would silently throw the
     reset token away and land on the sign-in screen instead of "Choose a new
     password". Do not simplify this to a bare path. */
  location.replace("../freecokiletics/" + location.search + location.hash);
})();
</script>
</body>
</html>
