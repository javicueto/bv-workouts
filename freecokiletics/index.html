<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Freecokiletics</title>
<meta name="theme-color" content="#0e1116">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Freecokiletics">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" aria-live="polite"></main>

<!-- Order matters: config → library → store → timer → runner → app. -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="data/programme.js"></script>
<script src="icons.js"></script>
<script src="ui.js"></script>
<script src="store.js"></script>
<script src="timer.js"></script>
<script src="runner.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    // When a newer version takes over, reload once so it is used straight away —
    // but only if an older version was already running (not on a first visit),
    // and never in the middle of a session (#/run/…), which must not be cut off.
    var hadController = !!navigator.serviceWorker.controller, reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloading || /^#\/run\//.test(location.hash)) return;
      reloading = true; location.reload();
    });
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
  }
</script>
</body>
</html>
