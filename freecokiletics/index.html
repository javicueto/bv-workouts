<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No user-scalable=no: it blocks pinch-zoom (WCAG 1.4.4) and buys nothing —
     every input is ≥16px so iOS never zooms on focus, and tap highlights are
     already off in the stylesheet. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cokiletics</title>
<meta name="theme-color" content="#0e0c0b">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "default", not "black-translucent": translucent draws the clock and
     battery in WHITE regardless of theme-color, invisible on the light theme's
     cream. With "default" iOS colours the glyphs from theme-color, which
     theme.js keeps in step with the page. iOS reads this once at launch. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cokiletics">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">

<!-- Link preview (WhatsApp, iMessage, Slack). og:image MUST be absolute:
     a relative path is silently ignored by every scraper. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cokiletics">
<meta property="og:title" content="Cokiletics">
<meta property="og:description" content="Your training plan — sessions, rest timer, weights log.">
<meta property="og:url" content="https://javicueto.github.io/bv-workouts/freecokiletics/">
<meta property="og:image" content="https://javicueto.github.io/bv-workouts/social/cokiletics.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Cokiletics">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="../fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<!-- After the stylesheet (so --ui-bg is readable) but before <body>, so the
     first paint already has the right palette. -->
<script src="theme.js"></script>
</head>
<body>
<!-- NOT aria-live: with the whole app live, a screen reader re-read every
     screen on every navigation and announced the rest countdown once per
     second. Screens announce their name through UI.announce() into the
     region below; countdowns are role="timer", which readers treat as opt-in. -->
<main id="app"></main>
<div id="announce" class="sr-only" aria-live="polite"></div>

<!-- Order matters: config → library → store → timer → runner → app.
     The Supabase client is VENDORED (vendor/), not loaded from a CDN: the
     service worker precaches the shell in one go, and a CDN hiccup at install
     time used to mean no offline shell at all. Upgrading = drop the new UMD
     build in vendor/, update this line, sw.js's SHELL, and bump CACHE. -->
<script src="config.js"></script>
<script src="vendor/supabase-js-2.116.0.min.js"></script>
<script src="data/programme.js"></script>
<script src="icons.js"></script>
<script src="ui.js"></script>
<script src="store.js"></script>
<script src="timer.js"></script>
<script src="runner.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    // When a newer version takes over, reload once so it is used straight away —
    // but only if an older version was already running (not on a first visit),
    // and never in the middle of a session (#/run/…), which must not be cut off.
    var hadController = !!navigator.serviceWorker.controller, reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloading || /^#\/run\//.test(location.hash)) return;
      reloading = true; location.reload();
    });
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
  }
</script>
</body>
</html>
