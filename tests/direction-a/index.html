<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Court — Cokiletics direction A</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="court.css">
</head>
<body>
<main class="rig">

  <div class="rig__intro">
    <h1>Court</h1>
    <p>Direction A for Cokiletics — dark ground, condensed industrial type, one signal orange.
    The session reads like a scoreboard: the round count is the biggest thing on the screen,
    and everything else gets out of its way. Real content from Workout 1.1.
    <a href="../direction-b/">See direction B →</a></p>
  </div>

  <div class="rig__screens">

    <!-- ───────────────────────────────────────────────── 1. the week -->
    <figure class="screen">
      <figcaption>1 · The week</figcaption>
      <div class="screen__body">
        <div class="bar">
          <div class="bar__mark">COKI<span>·</span>LETICS</div>
          <button class="bar__act" type="button">Menu</button>
        </div>

        <div class="scoreboard">
          <div class="scoreboard__meta"><span>Base · week 1 of 2</span><span>7–13 Sep</span></div>
          <h1 class="scoreboard__block">Block <em>01</em></h1>
          <p class="scoreboard__dates">Two sessions this week.</p>
        </div>

        <section class="day">
          <div class="day__top">
            <div class="day__n">01</div>
            <div class="day__grow">
              <h2 class="day__name">Workout 1.1</h2>
              <p class="day__sub">6 blocks · 16 rounds</p>
            </div>
            <span class="chip">To do</span>
          </div>
          <div class="rail">
            <div class="rail__row"><span class="rail__l">A</span><span class="rail__n">Shoulder stability</span><span class="rail__c">2 rds</span></div>
            <div class="rail__row"><span class="rail__l">B</span><span class="rail__n">Core stability</span><span class="rail__c">2 rds</span></div>
            <div class="rail__row"><span class="rail__l">C</span><span class="rail__n">Floor press + Band pull down</span><span class="rail__c">3 rds</span></div>
            <div class="rail__row"><span class="rail__l">D</span><span class="rail__n">Reverse lunge + SL deadlift</span><span class="rail__c">3 rds</span></div>
            <div class="rail__row"><span class="rail__l">E</span><span class="rail__n">DB Deadlift + Pulley</span><span class="rail__c">3 rds</span></div>
            <div class="rail__row"><span class="rail__l">F</span><span class="rail__n">Tabata</span><span class="rail__c">8 × 20″</span></div>
          </div>
          <div class="acts">
            <a class="btn btn--see" href="#session">View</a>
            <a class="btn btn--go" href="#round">Start</a>
          </div>
        </section>

        <section class="day">
          <div class="day__top">
            <div class="day__n">02</div>
            <div class="day__grow">
              <h2 class="day__name">Workout 1.2</h2>
              <p class="day__sub">6 blocks · 16 rounds</p>
            </div>
            <span class="chip">To do</span>
          </div>
          <div class="acts">
            <a class="btn btn--see" href="#session">View</a>
            <a class="btn btn--go" href="#round">Start</a>
          </div>
        </section>
      </div>
    </figure>

    <!-- ───────────────────────────────────────────── 2. the session -->
    <figure class="screen" id="session">
      <figcaption>2 · The session, before you start</figcaption>
      <div class="screen__body">
        <div class="bar">
          <button class="bar__act" type="button">‹ Back</button>
          <span class="bar__act" aria-hidden="true"></span>
        </div>

        <header class="shead">
          <div class="shead__k">Block 1 · session 1</div>
          <h1 class="shead__t">Workout 1.1</h1>
        </header>

        <section class="grp">
          <div class="grp__h">
            <span class="grp__l">A</span>
            <h2 class="grp__n">Shoulder stability</h2>
            <span class="grp__c">2 rds</span>
          </div>
          <p class="grp__r">No rest between rounds</p>
          <div class="moves">
            <div class="move">
              <img src="../../previews/11292707.webp" alt="">
              <span class="move__t"><b class="move__r">8 / side</b><span class="move__n">band internal rotation</span></span>
            </div>
            <div class="move">
              <img src="../../previews/11292710.webp" alt="">
              <span class="move__t"><b class="move__r">8 / side</b><span class="move__n">band external rotation</span></span>
            </div>
            <div class="move">
              <img src="../../previews/14360341.webp" alt="">
              <span class="move__t"><b class="move__r">12</b><span class="move__n">floor db shoulder blade depression</span></span>
            </div>
          </div>
        </section>

        <section class="grp">
          <div class="grp__h">
            <span class="grp__l">C</span>
            <h2 class="grp__n">Floor press + Band half kneeling pull down</h2>
            <span class="grp__c">3 rds</span>
          </div>
          <p class="grp__r">1 min rest between rounds</p>
          <div class="moves">
            <div class="move">
              <img src="../../previews/11307805.webp" alt="">
              <span class="move__t"><b class="move__r">10 / side</b><span class="move__n">single arm floor press</span></span>
            </div>
            <div class="move">
              <img src="../../previews/11288963.webp" alt="">
              <span class="move__t"><b class="move__r">12</b><span class="move__n">half kneeling band pull down</span></span>
            </div>
          </div>
        </section>

        <div class="acts">
          <a class="btn btn--go" href="#round" style="flex:1">Start this session</a>
        </div>
      </div>
    </figure>

    <!-- ─────────────────────────────────────────────── 3. a round -->
    <figure class="screen" id="round">
      <figcaption>3 · Mid-session — one round</figcaption>
      <div class="screen__body">
        <div class="round">
          <div class="round__top">
            <span>C · Floor press</span>
            <span class="pips" aria-label="Round 2 of 3">
              <i class="on"></i><i class="on"></i><i></i>
            </span>
          </div>

          <p class="round__cnt">02<small>of 3 rounds</small></p>

          <div class="ex">
            <img src="../../previews/11307805.webp" alt="">
            <div class="ex__row">
              <b class="ex__reps">10</b>
              <span class="ex__name">/ side · single arm floor press</span>
            </div>
            <div class="wt">
              <input id="w1" value="16" inputmode="decimal" aria-label="Weight in kilos">
              <label for="w1">kg</label>
              <span class="last">last time 14</span>
            </div>
          </div>

          <div class="ex">
            <img src="../../previews/11288963.webp" alt="">
            <div class="ex__row">
              <b class="ex__reps">12</b>
              <span class="ex__name">half kneeling band pull down</span>
            </div>
            <div class="wt">
              <input id="w2" value="" inputmode="decimal" aria-label="Weight in kilos" placeholder="—">
              <label for="w2">kg</label>
              <span class="last">band</span>
            </div>
          </div>

          <div class="round__foot">
            <a class="btn btn--go" href="#rest" style="width:100%">Done — rest 1 min</a>
          </div>
        </div>
      </div>
    </figure>

    <!-- ──────────────────────────────────────────────── 4. the rest -->
    <figure class="screen" id="rest">
      <figcaption>4 · Rest</figcaption>
      <div class="screen__body" style="padding:0">
        <div class="rest">
          <div class="rest__k">Rest · round 2 of 3</div>
          <div class="rest__dial">
            <svg class="rest__ring" viewBox="0 0 100 100" aria-hidden="true">
              <circle class="track" cx="50" cy="50" r="44"></circle>
              <circle class="arc" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="106"></circle>
            </svg>
            <p class="rest__t" role="timer">0:37</p>
          </div>
          <p class="rest__next">Next up<b>Round 3 · floor press</b></p>
          <div class="rest__acts">
            <button class="btn" type="button">+30″</button>
            <button class="btn btn--go" type="button">Skip</button>
          </div>
        </div>
      </div>
    </figure>

  </div>
</main>
</body>
</html>
