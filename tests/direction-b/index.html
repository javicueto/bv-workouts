<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programme — Cokiletics direction B</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="programme.css">
</head>
<body>
<main class="rig">

  <div class="rig__intro">
    <h1>Programme</h1>
    <p>Direction B for Cokiletics — light paper, a roman serif for anything you read rather than
    scan, and a single printed brick red used as a mark. The session reads like Francesco's
    written programme rather than a machine. Real content from Workout 1.1.
    <a href="../direction-a/">See direction A →</a></p>
  </div>

  <div class="rig__screens">

    <!-- ───────────────────────────────────────────────── 1. the week -->
    <figure class="screen">
      <figcaption>1 · The week</figcaption>
      <div class="screen__body">
        <div class="bar">
          <div class="bar__mark">Cokiletics</div>
          <button class="bar__act" type="button">Menu</button>
        </div>

        <div class="wk">
          <div class="wk__k">7–13 September · base</div>
          <h1 class="wk__h">Block one, <em>week 1 of 2</em></h1>
          <p class="wk__sub">Two sessions this week.</p>
        </div>

        <section class="day">
          <div class="day__k">Day one</div>
          <h2 class="day__name">Workout 1.1</h2>
          <p class="day__sub">Six blocks, A to F · sixteen rounds</p>
          <ul class="list">
            <li><span class="l">A</span><span class="n">Shoulder stability</span><span class="c">2 rds</span></li>
            <li><span class="l">B</span><span class="n">Core stability</span><span class="c">2 rds</span></li>
            <li><span class="l">C</span><span class="n">Floor press + Band pull down</span><span class="c">3 rds</span></li>
            <li><span class="l">D</span><span class="n">Reverse lunge + SL deadlift</span><span class="c">3 rds</span></li>
            <li><span class="l">E</span><span class="n">DB Deadlift + Pulley</span><span class="c">3 rds</span></li>
            <li><span class="l">F</span><span class="n">Tabata</span><span class="c">8 × 20″</span></li>
          </ul>
          <div class="acts">
            <a class="link link--go" href="#round">Start session</a>
            <a class="link" href="#session">Read it first</a>
          </div>
        </section>

        <section class="day">
          <div class="day__k">Day two</div>
          <h2 class="day__name">Workout 1.2</h2>
          <p class="day__sub">Six blocks, A to F · sixteen rounds</p>
          <div class="acts">
            <a class="link link--go" href="#round">Start session</a>
            <a class="link" href="#session">Read it first</a>
          </div>
        </section>
      </div>
    </figure>

    <!-- ───────────────────────────────────────────── 2. the session -->
    <figure class="screen" id="session">
      <figcaption>2 · The session, before you start</figcaption>
      <div class="screen__body">
        <div class="bar">
          <button class="bar__act" type="button">‹ Back</button>
          <span class="chip">Not done yet</span>
        </div>

        <header class="shead">
          <div class="shead__k">Block 1 · session 1</div>
          <h1 class="shead__t">Workout 1.1</h1>
        </header>

        <section class="grp">
          <div class="grp__h">
            <span class="grp__l">A</span>
            <h2 class="grp__n">Shoulder stability</h2>
            <span class="grp__c">2 rds</span>
          </div>
          <p class="grp__r">No rest between rounds</p>
          <div class="moves">
            <div class="move">
              <img src="../../previews/11292707.webp" alt="">
              <span class="move__t"><span class="move__r">8 / side</span> <span class="move__n">band internal rotation</span></span>
            </div>
            <div class="move">
              <img src="../../previews/11292710.webp" alt="">
              <span class="move__t"><span class="move__r">8 / side</span> <span class="move__n">band external rotation</span></span>
            </div>
            <div class="move">
              <img src="../../previews/14360341.webp" alt="">
              <span class="move__t"><span class="move__r">12</span> <span class="move__n">floor db shoulder blade depression</span></span>
            </div>
          </div>
        </section>

        <section class="grp">
          <div class="grp__h">
            <span class="grp__l">C</span>
            <h2 class="grp__n">Floor press + Band half kneeling pull down</h2>
            <span class="grp__c">3 rds</span>
          </div>
          <p class="grp__r">1 min rest between rounds</p>
          <div class="moves">
            <div class="move">
              <img src="../../previews/11307805.webp" alt="">
              <span class="move__t"><span class="move__r">10 / side</span> <span class="move__n">single arm floor press</span></span>
            </div>
            <div class="move">
              <img src="../../previews/11288963.webp" alt="">
              <span class="move__t"><span class="move__r">12</span> <span class="move__n">half kneeling band pull down</span></span>
            </div>
          </div>
        </section>

        <div class="acts" style="margin-top:var(--space-xl)">
          <a class="btn btn--go" href="#round">Start this session</a>
        </div>
      </div>
    </figure>

    <!-- ─────────────────────────────────────────────── 3. a round -->
    <figure class="screen" id="round">
      <figcaption>3 · Mid-session — one round</figcaption>
      <div class="screen__body">
        <div class="round">
          <div class="round__top">
            <span>C · Floor press</span>
            <span>Round 2 of 3</span>
          </div>

          <p class="round__cnt">Round <em>two</em></p>

          <div class="ex">
            <img src="../../previews/11307805.webp" alt="">
            <div class="ex__row">
              <b class="ex__reps">10</b>
              <span class="ex__name">/ side · single arm floor press</span>
            </div>
            <div class="wt">
              <input id="w1" value="16" inputmode="decimal" aria-label="Weight in kilos">
              <label for="w1">kg</label>
              <span class="last">last time 14</span>
            </div>
          </div>

          <div class="ex">
            <img src="../../previews/11288963.webp" alt="">
            <div class="ex__row">
              <b class="ex__reps">12</b>
              <span class="ex__name">half kneeling band pull down</span>
            </div>
            <div class="wt">
              <input id="w2" value="" inputmode="decimal" aria-label="Weight in kilos" placeholder="—">
              <label for="w2">kg</label>
              <span class="last">band</span>
            </div>
          </div>

          <div class="round__foot">
            <a class="btn btn--go" href="#rest" style="width:100%">Done — rest 1 min</a>
          </div>
        </div>
      </div>
    </figure>

    <!-- ──────────────────────────────────────────────── 4. the rest -->
    <figure class="screen" id="rest">
      <figcaption>4 · Rest</figcaption>
      <div class="screen__body" style="padding:0">
        <div class="rest">
          <div class="rest__k">Rest · round 2 of 3</div>
          <svg class="rest__ring" viewBox="0 0 100 100" role="img" aria-label="37 seconds left">
            <circle class="track" cx="50" cy="50" r="45"></circle>
            <circle class="arc" cx="50" cy="50" r="45" stroke-dasharray="282.7" stroke-dashoffset="108"></circle>
            <text x="50" y="50" text-anchor="middle" dominant-baseline="central" fill="currentColor"
                  font-size="24" font-family="Newsreader, Georgia, serif">0:37</text>
          </svg>
          <p class="rest__next">Next<b>Round three · floor press</b></p>
          <div class="rest__acts">
            <button class="link" type="button">+30 seconds</button>
            <button class="link link--go" type="button">Skip rest</button>
          </div>
        </div>
      </div>
    </figure>

  </div>
</main>
</body>
</html>
